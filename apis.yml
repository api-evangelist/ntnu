apis:
- aid: ntnu:ojs-oai
  name: NTNU Open Access Journals OAI-PMH
  description: >-
    NTNU runs its own Open Journal Systems installation, "NTNU Open Access Journals", on its own
    registrable domain at www.ntnu.no/ojs, publishing sixteen journals including Nordic Journal of
    Science and Technology Studies, Etikk i praksis, Fauna norvegica, Chironomus and the NIKT
    conference proceedings. Its OAI-PMH 2.0 interface is open, unauthenticated and institution
    operated: verb=Identify returns repositoryName "NTNU Open Access Journals" with adminEmail
    postmottak@ntnu.no, verb=ListMetadataFormats returns oai_dc, marcxml, oai_marc and rfc1807,
    and verb=ListSets returns the per-journal and per-section sets. This is the only openly
    callable API surface in this profile that NTNU itself operates. The companion OJS REST API at
    /api/v1/ is present but returns 403 without credentials.
