apis:
- aid: ntnu:cristin
  name: Cristin Research Information API
  description: >-
    Cristin is the Norwegian national Current Research Information System. NTNU's research output, persons,
    projects and institution records are exposed through the public Cristin v2 REST API; NTNU is Cristin
    institution id 194. The API returns JSON and is operated nationally by Sikt on behalf of participating
    institutions including NTNU.
  humanURL: https://api.cristin.no/v2/doc/index.html
  baseURL: https://api.cristin.no/v2/
  tags:
  - Research
  - CRIS
  - Publications
  - Open Data
  properties:
  - type: Documentation
    url: https://api.cristin.no/v2/doc/index.html
- aid: ntnu:nva
  name: NVA Nasjonalt Vitenarkiv API
  description: >-
    The National Research Archive (Nasjonalt vitenarkiv, NVA) is the Sikt operated open research archive
    that now hosts NTNU's institutional repository content (the former NTNU Open / ntnuopen.ntnu.no, which
    now redirects into NVA). NVA exposes a public REST API for publications and Cristin person/organization
    data.
  humanURL: https://nva.sikt.no/
  baseURL: https://api.nva.unit.no/
  tags:
  - Research
  - Repository
  - Open Access
  - Publications
  properties:
  - type: Documentation
    url: https://nva.sikt.no/
- aid: ntnu:tp
  name: TP Timetable Web Service
  description: >-
    TP (Timeplan) is the timetable, room-booking and course-activity system used by NTNU and hosted at
    tp.educloud.no/ntnu. It provides a versioned web-service interface under the /ntnu/ws/ path for course
    and timetable data. The web service is access controlled (returns HTTP 401 without credentials), so
    programmatic use requires institutional authorization.
  humanURL: https://tp.educloud.no/ntnu/timeplan/
  tags:
  - Timetable
  - Courses
  - Scheduling
  - Gated
  properties:
  - type: Documentation
    url: https://tp.educloud.no/ntnu/timeplan/
- aid: ntnu:feide
  name: Feide / Dataporten Identity (OpenID Connect / SAML)
  description: >-
    NTNU authenticates users through Feide, the national identity federation operated by Sikt, with Dataporten
    providing OAuth2 / OpenID Connect and SAML based single sign-on and identity APIs. Service providers
    integrating with NTNU users register clients and obtain tokens through Feide.
  humanURL: https://docs.feide.no/
  baseURL: https://auth.dataporten.no/
  tags:
  - Identity
  - Authentication
  - OpenID Connect
  - SAML
  - SSO
