aid: ntnu
name: Norwegian University of Science and Technology
description: >-
  The Norwegian University of Science and Technology (NTNU) is Norway's largest university,
  headquartered in Trondheim with campuses in Gjovik and Alesund. NTNU operates no consolidated
  institutional developer portal and publishes no OpenAPI, AsyncAPI or other machine-readable API
  contract of its own. Its one openly callable, institution-operated surface is the OAI-PMH
  interface of NTNU Open Access Journals at www.ntnu.no/ojs, which answers Identify,
  ListMetadataFormats and ListSets over sixteen NTNU-published journals. NTNU also runs an
  institutional API gateway at api.ntnu.no, but every path on it is behind Feide OAuth and no
  public documentation, contract or scope list is served without an institutional account.
  Everything else that looks programmable under NTNU's name is operated by somebody else and
  entered here as a tenant relationship, not as NTNU engineering: research data in the NTNU
  collection of DataverseNO (run by UiT The Arctic University of Norway on Dataverse software),
  research information in Cristin and the national research archive NVA (both run by Sikt),
  timetables in TP on educloud.no, identity in the Feide federation where NTNU exists as the
  scope ntnu.no on Sikt's national IdP rather than as its own eduGAIN entity, and teaching in a
  hosted Canvas tenant. This repo previously carried 35 OpenAPI files and 87 derived artifacts
  that were splits of the generic Dataverse 6.6 product contract; they were the vendor's, not
  NTNU's, and have been removed.
