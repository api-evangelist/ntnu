- aid: ntnu:dataverseno
  name: DataverseNO — NTNU Research Data Collection
  description: >-
    NTNU's research data is deposited into the "NTNU – Norwegian University of Science and
    Technology" collection (alias "ntnu") of DataverseNO, the Norwegian national research-data
    repository operated by UiT The Arctic University of Norway on Dataverse software. The
    collection is real and NTNU-scoped — its registered contact is research-data@ntnu.no and it
    has been released since 2018 — but the API that serves it is the generic Dataverse 6.6 product
    contract published at dataverse.no/openapi and shared by every Dataverse installation. That
    contract belongs to the Dataverse project and to DataverseNO, not to NTNU, and is therefore
    recorded here as a tenant relationship rather than saved as an NTNU OpenAPI.
  humanURL: https://dataverse.no/dataverse/ntnu
  baseURL: https://dataverse.no/api/dataverses/ntnu
