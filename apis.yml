- aid: ntnu:feide
  name: Feide / Dataporten Identity Federation (NTNU membership)
  description: >-
    NTNU authenticates through Feide, the Norwegian national identity federation operated by Sikt,
    with Dataporten providing OAuth2 / OpenID Connect and SAML single sign-on. NTNU does not
    publish its own SAML entity: a scan of the Feide eduGAIN metadata on 2026-08-30 found no
    entityID under an ntnu domain, only the shibmd:Scope value "ntnu.no" attached to Sikt's
    national IdP entity https://idp.feide.no. NTNU is therefore a scope inside somebody else's
    federation entity — a genuine institutional identity fact, but not NTNU-operated identity
    infrastructure.
  humanURL: https://docs.feide.no/
  baseURL: https://auth.dataporten.no/
  x-operator: tenant
  x-operator-note: >-
