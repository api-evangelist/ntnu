x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    NTNU publishes no API contract of its own — no OpenAPI, AsyncAPI, GraphQL schema, llms.txt or
    developer portal exists on any NTNU host (www.ntnu.no/llms.txt 404, developer.ntnu.no does not
    resolve). It does operate a real API gateway at api.ntnu.no, but every path on it, including
    /docs, /openapi.json and /status, redirects to Feide OAuth and serves the same account-chooser
    page, so no contract, scope list or reference could be read without an institutional account.
    The one institution-operated surface that is openly callable is the OAI-PMH interface of NTNU
    Open Access Journals at www.ntnu.no/ojs, which was fully probed and is recorded as an API. All
    remaining programmable footprint is tenant: DataverseNO (UiT), Cristin and NVA (Sikt), TP
    (educloud.no) and Feide (Sikt). This profile is thin because NTNU's own API surface is behind
    a national identity federation, not because it was unreachable.
  evidence:
